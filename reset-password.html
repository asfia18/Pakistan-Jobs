<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Pakistan Jobs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">
    <div class="brand-section">
        <h1>Pakistan Jobs</h1>
        <p>Find Latest Jobs in Pakistan</p>
    </div>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="category.html">Categories</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>



<main class="reset-password-page">

    <div class="reset-password-box">

        <h2>Reset Password</h2>

        <p class="reset-subtitle">
            Enter your new password below.
        </p>

        <form id="resetPasswordForm">

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >
            </div>


            <button type="submit" id="resetButton">
                Update Password
            </button>

        </form>

       <p id="resetMessage" class="reset-message"></p>

        <p class="reset-link">
            <a href="login.html">Back to Login</a>
        </p>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const resetForm = document.getElementById("resetPasswordForm");
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetButton = document.getElementById("resetButton");
const resetMessage = document.getElementById("resetMessage");


resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;


    if (newPassword.length < 6) {
        resetMessage.textContent =
            "Password must be at least 6 characters long.";

        return;
    }


    if (newPassword !== confirmPassword) {
        resetMessage.textContent =
            "Passwords do not match.";

        return;
    }


    resetButton.disabled = true;
    resetButton.textContent = "Updating...";


    const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
    });


    if (error) {

        console.error(error);

        resetMessage.textContent = error.message;

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";

        return;
    }


    resetMessage.textContent =
        "Password updated successfully! Redirecting to Login...";


    setTimeout(function() {
        window.location.href = "login.html";
    }, 2000);

});

</script>

</body>
</html>
